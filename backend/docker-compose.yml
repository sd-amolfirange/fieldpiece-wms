name: fieldpiece-wms

# Local development stack (build guide Section 2.2).
# Host ports are overridable because 5432 is often taken by a locally installed Postgres.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro # creates app roles, extensions, test DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_owner -d wms"]
      interval: 5s
      retries: 10
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c log_min_duration_statement=250
               -c max_connections=200

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-localdev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["${PGADMIN_PORT:-5050}:80"]
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro # pre-registers the local DB
    depends_on: [postgres]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest # Docker Hub minio/* images are no longer published
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-localdev123}
      # Browser uploads go straight to storage with presigned URLs (ADR-008), so the web origin needs CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]

  mailpit: # catches outgoing email locally
    image: axllent/mailpit
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "${MAILPIT_SMTP_PORT:-1025}:1025"]

  api:
    profiles: ["app"]
    build: { context: ., target: dev }
    env_file: .env
    environment: &container-env
      DATABASE_URL: postgresql://wms_app:localdev@postgres:5432/wms
      DATABASE_MIGRATION_URL: postgresql://wms_owner:${POSTGRES_PASSWORD:-localdev}@postgres:5432/wms
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      SMTP_URL: smtp://mailpit:1025
    command: sh -c "pnpm prisma migrate deploy && pnpm start:dev"
    ports: ["3000:3000", "9229:9229"] # 9229 = debugger
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started } # the API creates the bucket on startup in local dev

  worker:
    profiles: ["app"]
    build: { context: ., target: dev }
    env_file: .env
    environment: *container-env
    command: pnpm worker:dev
    volumes: [".:/app", "/app/node_modules"]
    depends_on: [api]

volumes: { pgdata: {}, miniodata: {} }
