name: fieldpiece-wms

# Local development stack. `docker compose up -d` starts Postgres, Redis and pgAdmin; run the API on the host
# (`npm run start:dev`). `docker compose --profile app up -d --build` also runs the API in a container.
# Host ports are overridable because 5432 is often taken by a locally installed Postgres.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro # creates the app roles and databases
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_owner -d wms"]
      interval: 5s
      retries: 10
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c log_min_duration_statement=250
               -c max_connections=200

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-localdev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["${PGADMIN_PORT:-5050}:80"]
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on: [postgres]

  redis: # optional: shared rate-limit counters
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio: # optional S3-compatible storage (STORAGE_DRIVER=minio); the default local driver needs nothing
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-localdev123}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]

  migrate:
    profiles: ["app"]
    build: { context: .., dockerfile: backend/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://wms_app:localdev@postgres:5432/wms_hvac
      DATABASE_MIGRATION_URL: postgresql://wms_owner:${POSTGRES_PASSWORD:-localdev}@postgres:5432/wms_hvac
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: .., dockerfile: backend/Dockerfile, target: runtime }
    env_file: .env
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://wms_app:localdev@postgres:5432/wms_hvac
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /home/node/storage
    ports: ["${API_PORT:-4000}:4000"]
    volumes: [apistorage:/home/node/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes: { pgdata: {}, miniodata: {}, apistorage: {} }
