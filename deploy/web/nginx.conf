# Serves the built frontend and forwards /api to the API container, so the browser sees one origin (the session
# cookie and <img src> file URLs need that).

# Behind a cloud load balancer that terminates TLS, keep its X-Forwarded-Proto so the API marks cookies Secure.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Uploads are up to 15 MB (UPLOAD_MAX_BYTES); leave room for the multipart envelope.
  client_max_body_size 20m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Docker's resolver, so nginx finds the API again after it restarts with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;
  set $assistant_upstream http://chatbot:8090;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Warranty Assistant (chatbot service): widget files and its chat API, same origin as the portal. Answers 502
  # when the assistant isn't running; the portal then simply shows no chat button.
  location /assistant/ {
    rewrite ^/assistant/(.*)$ /$1 break;
    proxy_pass $assistant_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: every other path is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
